tracker_type: botsort

track_high_thresh: 0.25
track_low_thresh: 0.05    # litt lavere → mer tolerant mot svakere matches
new_track_thresh: 0.5     # litt høyere → færre nyopprettede ID'er

track_buffer: 180         # ca 6 s ved 30 FPS → bilen “lever lenger” selv om den er blurr
match_thresh: 0.7         # lavere enn 0.8 → mer tolerant på IoU/score ved blur
fuse_score: True

gmc_method: none

# hvis du har/tenker å bruke ReID
proximity_thresh: 0.7     # mer fleksibel posisjon
appearance_thresh: 0.3    # mer fleksibel utseende ved blur
with_reid: True
model: auto
