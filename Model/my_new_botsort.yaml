tracker_type: botsort

track_high_thresh: 0.4
track_low_thresh: 0.05    # litt lavere → mer tolerant mot svakere matches
new_track_thresh: 0.5     # høyere → krever mer sikkerhet før ny track opprettes

track_buffer: 100          # ~1.5 s ved 30 FPS -> tåler korte occlusions bedre
match_thresh: 0.75        # strengere matching reduserer ID-hop mellom ulike kjøretøy
fuse_score: True

gmc_method: none # Statisk kamera, ingen geometrisk matching

# hvis du har/tenker å bruke ReID
proximity_thresh: 0.5     # krever nærmere geometrisk match
appearance_thresh: 0.5   # strengere ReID for å unngå feil ID-overføring
with_reid: True
model: auto
